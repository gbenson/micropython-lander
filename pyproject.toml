[project]
name = "micropython-lander"
version = "0.0.0"
authors = [{ name = "Gary Benson", email = "gary@gbenson.net" }]
description = "MicroPython port of Lander"
readme = "README.md"
dependencies = [
    "flake8",
    "flake8-quotes",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/gbenson/micropython-lander"

[project.scripts]
update-package-json = "scripts.update_package_json:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.mypy]
mypy_path = "stubs"
warn_unused_configs = true
strict = true
